<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>MCU Character Filmstrip</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background: #000000;
      border: 0;
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(154px, 16.8vw, 238px);
      aspect-ratio: 0.72;
      padding: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f3e7ce;
      background: #0a0a0f;
      box-shadow:
        0 calc(10px + var(--focus) * 24px) calc(20px + var(--focus) * 36px)
          rgba(0, 0, 0, calc(0.7 + var(--focus) * 0.3)),
        0 0 calc(var(--focus) * 28px) rgba(255, 255, 255, calc(var(--focus) * 0.35)),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, calc(0.06 + var(--focus) * 0.14));
      border-radius: 8px;
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(0, 0, 0, 0.85),
        0 0 0 3px rgba(255, 255, 255, 0.7);
    }

    .portrait {
      position: absolute;
      inset: 6px 6px 26%;
      overflow: hidden;
      border-radius: 8px 8px 0 0;
      background: #000000;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      transform: scale(calc(1.02 + (1 - var(--focus)) * 0.06));
      filter:
        saturate(calc(0.85 + var(--focus) * 0.35))
        contrast(1.06);
      transition: filter 0.2s ease-out;
    }

    .footer {
      position: absolute;
      right: 6px;
      bottom: 6px;
      left: 6px;
      height: calc(26% - 6px);
      display: grid;
      grid-template-columns: clamp(24px, 2.8vw, 36px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 10px);
      padding: clamp(6px, 0.7vw, 10px);
      color: #f0dfc2;
      background: #000000;
      border-radius: 0 0 8px 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .index {
      display: grid;
      width: clamp(22px, 2.5vw, 32px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      color: #ffffff;
      font: 600 clamp(7.5px, 0.65vw, 10px)/1 ui-monospace, "SFMono-Regular", monospace;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: #ffffff;
      font-size: clamp(8.5px, 0.8vw, 12px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.15;
    }

    .role {
      margin-top: clamp(2px, 0.3vw, 4px);
      color: #d4d4d8;
      font-size: clamp(5.5px, 0.45vw, 7.5px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 540px;
        cursor: ns-resize;
        background: #000000;
      }

      .card {
        width: clamp(142px, 47vw, 180px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>

      const profiles = (window.__CUSTOM_PROFILES__ && Array.isArray(window.__CUSTOM_PROFILES__) && window.__CUSTOM_PROFILES__.length > 0)
        ? window.__CUSTOM_PROFILES__
        : defaultProfiles;

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Focus ${profile.name}, ${profile.role}`);
        card.innerHTML = `
          <span class="portrait">
            <img src="${profile.portrait}" alt="Portrait of ${profile.name}" loading="lazy">
          </span>
          <span class="footer">
            <span class="index">${String(index + 1).padStart(2, "0")}</span>
            <span class="meta">
              <span class="name">${profile.name}</span>
              <span class="role">${profile.role}</span>
            </span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 0,
        target: 0,
        base: 0,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base += delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => {
          const profile = profiles[index];
          if (nearestIndex() === index && profile && profile.id) {
            window.parent.postMessage({ type: "character-select", characterId: profile.id }, "*");
          } else {
            moveTo(index);
          }
        });
        card.addEventListener("focus", () => moveTo(index));
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        state.active = true;
        state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
        state.lastInput = performance.now();
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.base += direction;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      window.addEventListener("message", (event) => {
        if (!event.data) return;
        if (event.data.type === "step-prev" || event.data.type === "step-left") {
          state.base -= 1;
          state.target = state.base;
          state.active = false;
          state.lastInput = performance.now();
        } else if (event.data.type === "step-next" || event.data.type === "step-right") {
          state.base += 1;
          state.target = state.base;
          state.active = false;
          state.lastInput = performance.now();
        }
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        if (!state.active && time - state.lastInput > 3600) {
          const idle = time - state.lastInput - 3600;
          state.target = state.base + Math.sin(idle * 0.00042) * 2.45;
        }

        state.phase += (state.target - state.phase) * ease;
        const compact = innerWidth < 650;
        const activeIndex = nearestIndex();
        const horizontalSpacing = Math.min(168, Math.max(112, innerWidth * 0.116));
        const verticalSpacing = Math.min(122, Math.max(88, innerHeight * 0.112));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
